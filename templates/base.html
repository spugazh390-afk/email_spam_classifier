<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Email Spam Classifier{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <!-- Top Navigation Bar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <!-- Logo -->
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-md shadow-indigo-200">
                        <i class="fa-solid fa-shield-halved text-xl"></i>
                    </div>
                    <div>
                        <a href="/" class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">
                            SpamGuard AI
                        </a>
                        <span class="hidden sm:inline-block ml-2 text-xs bg-indigo-100 text-indigo-700 font-semibold px-2 py-0.5 rounded-full">
                            XAI Powered
                        </span>
                    </div>
                </div>

                <!-- Nav Links -->
                <nav class="flex items-center space-x-1 sm:space-x-4">
                    <a href="/" class="nav-link px-3 py-2 rounded-lg text-sm font-medium transition-colors flex items-center space-x-2 text-slate-700 hover:text-indigo-600 hover:bg-slate-100">
                        <i class="fa-solid fa-envelope-open-text"></i>
                        <span>Classifier</span>
                    </a>
                    <a href="/history" class="nav-link px-3 py-2 rounded-lg text-sm font-medium transition-colors flex items-center space-x-2 text-slate-700 hover:text-indigo-600 hover:bg-slate-100">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                        <span>Prediction History</span>
                    </a>
                    <a href="/admin" class="nav-link px-3 py-2 rounded-lg text-sm font-medium transition-colors flex items-center space-x-2 text-slate-700 hover:text-indigo-600 hover:bg-slate-100">
                        <i class="fa-solid fa-chart-pie"></i>
                        <span>Admin Dashboard</span>
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500">
        <div class="max-w-7xl mx-auto px-4">
            <p>SpamGuard AI &bull; Features: <strong>1. Confidence Score</strong> &bull; <strong>2. Explainable AI (XAI)</strong> &bull; <strong>3. Prediction History</strong> &bull; <strong>4. Admin Dashboard</strong></p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
